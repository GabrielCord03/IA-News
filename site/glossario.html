<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Glossário</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">
      <svg class="icon mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M15.3 8.7l-2.2 5-5 2.2 2.2-5 5-2.2Z"/></svg>
      Radar IA
    </a>
    <nav class="site-nav">
      <a href="index.html">Hoje</a>
      <a href="historico.html">Histórico</a>
      <a href="categoria.html">Categorias</a>
      <a href="glossario.html" class="active">Glossário</a>
      <button id="theme-toggle" type="button"></button>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">Glossário</h1>
  <div class="search-field">
    <label for="glossario-search" class="sr-only">Buscar termo no glossário</label>
    <span class="icon-slot"></span>
    <input id="glossario-search" type="search" placeholder="Buscar termo…" autocomplete="off" />
  </div>
  <dl class="glossario-list" id="content"><p class="state-msg">Carregando catálogo de espécimes…</p></dl>
  <footer class="site-footer">Radar IA — diário de campo, atualizado por Hermes.</footer>
</main>
<script src="js/icons.js"></script>
<script src="js/common.js"></script>
<script>
  initTheme();
  document.querySelector(".search-field .icon-slot").outerHTML = svgIcon("search", 17);
  const content = document.getElementById("content");
  const search = document.getElementById("glossario-search");
  let terms = [];

  function render(filter) {
    const f = (filter || "").trim().toLowerCase();
    const filtered = f
      ? terms.filter(([t, exp]) => t.toLowerCase().includes(f) || exp.toLowerCase().includes(f))
      : terms;
    if (!filtered.length) {
      content.innerHTML = '<p class="state-msg">Nenhum termo encontrado.</p>';
      return;
    }
    content.innerHTML = filtered
      .map(([t, exp]) => `<dt id="${slugifyTerm(t)}">${escapeHtml(t)}</dt><dd>${escapeHtml(exp)}</dd>`)
      .join("");
  }

  fetchJson("../glossario.json")
    .then((data) => {
      terms = Object.entries(data).sort((a, b) => a[0].localeCompare(b[0], "pt-BR"));
      render("");
      if (window.location.hash) {
        const id = decodeURIComponent(window.location.hash.slice(1));
        setTimeout(() => {
          const el = document.getElementById(slugifyTerm(id)) || document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 50);
      }
    })
    .catch((err) => {
      content.innerHTML = `<p class="state-msg">Erro ao carregar glossário: ${escapeHtml(err.message)}</p>`;
    });

  search.addEventListener("input", () => render(search.value));
</script>
</body>
</html>
