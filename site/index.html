<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Hoje</title>
<meta name="description" content="Diário de campo pessoal sobre o mundo da Inteligência Artificial." />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-word">Radar</span><span class="brand-mark label">IA</span>
    </a>
    <nav class="site-nav">
      <a href="index.html" class="active">Hoje</a>
      <a href="historico.html">Histórico</a>
      <a href="categoria.html">Categorias</a>
      <a href="glossario.html">Glossário</a>
    </nav>
    <button id="theme-toggle" type="button"></button>
  </div>
</header>
<main class="wrap">
  <div id="content"><p class="state-msg">Carregando registro do dia…</p></div>
  <footer class="site-footer">Radar IA — briefing diário, atualizado por Hermes.</footer>
</main>
<script src="js/common.js"></script>
<script>
  initTheme();
  const content = document.getElementById("content");
  fetchJson("../index.json")
    .then((days) => {
      if (!days.length) {
        content.innerHTML = '<p class="state-msg">Nenhum dia registrado ainda.</p>';
        return;
      }
      const latest = days.reduce((a, b) => (a.data > b.data ? a : b));
      return fetchJson(`../data/${latest.data}.json`).then((day) => renderDigest(day, content));
    })
    .catch(() => {
      content.innerHTML = '<p class="state-msg">Não foi possível carregar o registro de hoje. Tente recarregar a página.</p>';
    });
</script>
</body>
</html>
