<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Dia</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-word">Radar</span><span class="brand-mark label">IA</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Hoje</a>
      <a href="historico.html" class="active">Histórico</a>
      <a href="categoria.html">Categorias</a>
      <a href="glossario.html">Glossário</a>
    </nav>
    <button id="theme-toggle" type="button"></button>
  </div>
</header>
<main class="wrap">
  <div id="content"><p class="state-msg">Carregando registro do dia…</p></div>
  <footer class="site-footer">Radar IA — briefing diário, atualizado por Hermes.</footer>
</main>
<script src="js/common.js"></script>
<script>
  initTheme();
  const content = document.getElementById("content");
  const params = new URLSearchParams(window.location.search);
  const data = params.get("data");
  if (!data) {
    content.innerHTML = '<p class="state-msg">Nenhuma data informada. <a href="historico.html">Ver histórico</a>.</p>';
  } else {
    fetchJson(`../data/${data}.json`)
      .then((day) => {
        document.title = `Radar IA — ${fmtDate(day.data)}`;
        renderDigest(day, content);
      })
      .catch(() => {
        content.innerHTML = `<p class="state-msg">Não encontramos registro para ${escapeHtml(fmtDate(data))}. <a href="historico.html">Ver histórico</a>.</p>`;
      });
  }
</script>
</body>
</html>
