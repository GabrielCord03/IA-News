<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Histórico</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-word">Radar</span><span class="brand-mark label">IA</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Hoje</a>
      <a href="historico.html" class="active">Histórico</a>
      <a href="categoria.html">Categorias</a>
      <a href="glossario.html">Glossário</a>
      <a href="destaques.html">Destaques</a>
    </nav>
    <button id="theme-toggle" type="button"></button>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">Histórico</h1>
  <div id="content"><p class="state-msg">Carregando edições anteriores…</p></div>
  <footer class="site-footer">Radar IA — briefing diário, atualizado por Hermes.</footer>
</main>
<script src="js/common.js"></script>
<script>
  initTheme();
  const content = document.getElementById("content");
  fetchJson("../index.json")
    .then((days) => {
      if (!days.length) {
        content.innerHTML = '<p class="state-msg">Nenhum dia registrado ainda.</p>';
        return;
      }
      const sorted = [...days].sort((a, b) => (a.data < b.data ? 1 : -1));
      const items = sorted
        .map((d) => {
          const badge = d.destaque_do_dia ? `<span class="badge label">Avistamento raro</span>` : "";
          return `
            <li><a class="history-item" href="dia.html?data=${encodeURIComponent(d.data)}">
              <div class="date-row">
                <span class="day-date">${fmtDate(d.data)}</span>
                ${badge}
              </div>
              <p class="history-summary">${escapeHtml(d.resumo)}</p>
            </a></li>
          `;
        })
        .join("");
      content.innerHTML = `<ul class="history-list">${items}</ul>`;
    })
    .catch(() => {
      content.innerHTML = '<p class="state-msg">Não foi possível carregar o histórico. Tente recarregar a página.</p>';
    });
</script>
</body>
</html>
