<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Histórico</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="brand" href="index.html">
      <svg class="icon mark" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M15.3 8.7l-2.2 5-5 2.2 2.2-5 5-2.2Z"/></svg>
      Radar IA
    </a>
    <nav class="site-nav">
      <a href="index.html">Hoje</a>
      <a href="historico.html" class="active">Histórico</a>
      <a href="categoria.html">Categorias</a>
      <a href="glossario.html">Glossário</a>
      <button id="theme-toggle" type="button"></button>
    </nav>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">Histórico</h1>
  <div id="content"><p class="state-msg">Carregando cadernos anteriores…</p></div>
  <footer class="site-footer">Radar IA — diário de campo, atualizado por Hermes.</footer>
</main>
<script src="js/icons.js"></script>
<script src="js/common.js"></script>
<script>
  initTheme();
  const content = document.getElementById("content");
  fetchJson("../index.json")
    .then((days) => {
      if (!days.length) {
        content.innerHTML = '<p class="state-msg">Nenhum dia registrado ainda.</p>';
        return;
      }
      const sorted = [...days].sort((a, b) => (a.data < b.data ? 1 : -1));
      const items = sorted
        .map((d) => {
          const badge = d.destaque_do_dia
            ? `<span class="badge">${svgIcon("sighting", 12)}Avistamento raro</span>`
            : "";
          return `
            <li><a class="history-item" href="dia.html?data=${encodeURIComponent(d.data)}">
              <div class="date-row">
                <span class="day-date">${fmtDate(d.data)}</span>
                ${badge}
              </div>
              <p>${escapeHtml(d.resumo)}</p>
            </a></li>
          `;
        })
        .join("");
      content.innerHTML = `<ul class="history-list">${items}</ul>`;
    })
    .catch((err) => {
      content.innerHTML = `<p class="state-msg">Erro ao carregar histórico: ${escapeHtml(err.message)}</p>`;
    });
</script>
</body>
</html>
