<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radar IA — Categorias</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-word">Radar</span><span class="brand-mark label">IA</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">Hoje</a>
      <a href="historico.html">Histórico</a>
      <a href="categoria.html" class="active">Categorias</a>
      <a href="glossario.html">Glossário</a>
    </nav>
    <button id="theme-toggle" type="button"></button>
  </div>
</header>
<main class="wrap">
  <h1 class="page-title">Categorias</h1>
  <label for="categoria-select" class="select-label">Filtrar por categoria</label>
  <div class="select-wrap">
    <select id="categoria-select"></select>
  </div>
  <div id="content"><p class="state-msg">Escolha uma categoria.</p></div>
  <footer class="site-footer">Radar IA — briefing diário, atualizado por Hermes.</footer>
</main>
<script src="js/common.js"></script>
<script>
  initTheme();
  const select = document.getElementById("categoria-select");
  const content = document.getElementById("content");

  select.innerHTML = SECTIONS.map((s) => `<option value="${s.key}">${s.label}</option>`).join("");

  const params = new URLSearchParams(window.location.search);
  const initialKey = params.get("s");
  if (initialKey && SECTIONS.some((s) => s.key === initialKey)) select.value = initialKey;

  let indexDays = null;
  const dayCache = new Map();

  async function loadCategory(key) {
    content.innerHTML = '<p class="state-msg">Vasculhando edições anteriores…</p>';
    if (!indexDays) indexDays = await fetchJson("../index.json");
    const sorted = [...indexDays].sort((a, b) => (a.data < b.data ? 1 : -1));
    const dayDatas = await Promise.all(
      sorted.map((d) => {
        if (dayCache.has(d.data)) return dayCache.get(d.data);
        const p = fetchJson(`../data/${d.data}.json`).catch(() => null);
        dayCache.set(d.data, p);
        return p;
      })
    );
    const meta = sectionMeta(key);
    let html = "";
    let i = 0;
    for (const day of dayDatas) {
      if (!day) continue;
      const items = day.secoes && day.secoes[key];
      if (!items || !items.length) continue;
      i += 1;
      html += `
        <section class="category-section">
          <div class="category-head">
            <span class="mono-index">${String(i).padStart(2, "0")}</span>
            <h2 class="category-title"><a href="dia.html?data=${encodeURIComponent(day.data)}">${fmtDate(day.data)}</a></h2>
            <span class="label cat-count">${items.length}</span>
          </div>
          <div class="item-list">${items.map((it) => renderItem(it)).join("")}</div>
        </section>
      `;
    }
    content.innerHTML = html || `<p class="state-msg">Nada registrado ainda em ${escapeHtml(meta.label)}.</p>`;
  }

  select.addEventListener("change", () => {
    const url = new URL(window.location);
    url.searchParams.set("s", select.value);
    window.history.replaceState({}, "", url);
    loadCategory(select.value);
  });

  loadCategory(select.value);
</script>
</body>
</html>
